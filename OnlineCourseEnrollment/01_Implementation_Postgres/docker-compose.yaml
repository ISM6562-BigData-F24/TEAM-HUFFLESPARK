services:
  # Node 1
  project-node1:
    image: postgres:latest
    container_name: project_node1
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password1
      POSTGRES_DB: project_db1
    ports:
      - "6432:5432"
    volumes:
      - ./node1_data:/var/lib/postgresql/data
# The following settings will be discussed in class
#    networks:
#      - postgres_cluster
#    deploy:
#      resources:
#        limits:
#          cpus: '1.0'
#          memory: 2G

  # Node 2
  project-node2:
    image: postgres:latest
    container_name: project_node2
    environment:
      POSTGRES_USER: user2
      POSTGRES_PASSWORD: password2
      POSTGRES_DB: project_db2
    ports:
      - "6433:5432"
    volumes:
      - ./node2_data:/var/lib/postgresql/data
#    networks:
#      - postgres_cluster
#    deploy:
#      resources:
#        limits:
#          cpus: '1.0'
#          memory: 2G

  # Node 3
  project-node3:
    image: postgres:latest
    container_name: project_node3
    environment:
      POSTGRES_USER: user3
      POSTGRES_PASSWORD: password3
      POSTGRES_DB: project_db3
    ports:
      - "6434:5432"
    volumes:
      - ./node3_data:/var/lib/postgresql/data
#    networks:
#      - postgres_cluster
#    deploy:
#      resources:
#        limits:
#          cpus: '1.0'
#          memory: 2G

  # Node for Partitioning
  project-node-partition:
    image: postgres:latest
    container_name: project_node_partition
    environment:
      POSTGRES_USER: user_partition
      POSTGRES_PASSWORD: password_partition
      POSTGRES_DB: project_db_partition
    ports:
      - "6435:5432"  # Expose a new port for the partitioning node
    volumes:
      - ./node_partition_data:/var/lib/postgresql/data

  # pgAdmin 4 Setup
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    restart: always
    ports:
      - 6050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENABLE_PSQL: "True"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
